<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online fee setup | Chords Music Academy</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f0;color:#1a2a3a;padding:20px 16px 40px;}
  .panel{max-width:560px;margin:0 auto 16px;background:#fff;border-radius:12px;padding:18px;border:1px solid #d9d4cd;}
  h1{font-size:1.2rem;margin-bottom:4px;}
  .sub{color:#666;font-size:.9rem;margin-bottom:14px;}
  label{display:block;font-size:.8rem;color:#666;margin:10px 0 4px;font-weight:600;}
  input,select{width:100%;padding:10px;font:inherit;border:1px solid #cfd6df;border-radius:8px;}
  .btn{margin-top:14px;width:100%;padding:12px;font:inherit;font-weight:700;color:#fff;background:#1a2a3a;border:0;border-radius:8px;cursor:pointer;}
  .btn:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:10px;font-size:.9rem;min-height:1.2em;}
  .ok{color:#15803d;} .err{color:#b03030;}
  .current{font-size:.85rem;color:#444;margin-top:8px;background:#f8fafc;border-radius:8px;padding:8px 10px;display:none;}
</style>
</head>
<body>

<div class="panel" id="login-panel" style="display:none;">
  <h1>Admin login</h1>
  <label for="pw">CRM password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="login-btn">Log in</button>
  <div class="msg err" id="login-msg"></div>
</div>

<div class="panel" id="form-panel" style="display:none;">
  <h1>Online student fee setup</h1>
  <p class="sub">Monthly students pay their fixed fee on the 1st. Quarterly (3-month) students are not changed here.</p>

  <label for="student">Student</label>
  <select id="student"></select>
  <div class="current" id="current"></div>

  <label for="fee">Fixed monthly fee (₹)</label>
  <input id="fee" type="number" min="0" step="1" placeholder="e.g. 5000">

  <label for="plan">Payment plan</label>
  <select id="plan">
    <option value="monthly">Monthly, on the 1st</option>
  </select>

  <label for="next">Next due date</label>
  <input id="next" type="date">

  <button class="btn" id="save-btn">Save</button>
  <div class="msg" id="msg"></div>
</div>

<script>
(function () {
  var API = '/.netlify/functions/pay-admin-student';
  var TOKEN = sessionStorage.getItem('crm_token') || '';
  var students = [];

  function call(body) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-token': TOKEN },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, data: d }; }); });
  }

  function nextFirst() {
    var t = new Date();
    if (t.getDate() === 1) return t.toISOString().slice(0, 10);
    var d = new Date(t.getFullYear(), t.getMonth() + 1, 1);
    return d.toISOString().slice(0, 10);
  }

  function setMsg(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

  function loadStudents() {
    call({ action: 'crm_list' }).then(function (res) {
      if (!res.ok) { setMsg(document.getElementById('msg'), 'Could not load students. Log in again.', false); return; }
      students = (res.data.students || []).filter(function (s) { return s.mode === 'online' && s.is_active; })
        .sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
      var sel = document.getElementById('student');
      sel.innerHTML = '<option value="">Select a student</option>' + students.map(function (s) {
        return '<option value="' + s.id + '">' + escapeHtml(s.name) + ' (' + s.student_id + ')</option>';
      }).join('');
      document.getElementById('next').value = nextFirst();
    });
  }

  function escapeHtml(t) { return String(t || '').replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

  document.getElementById('student').addEventListener('change', function () {
    var s = students.find(function (x) { return x.id === this.value; }, this);
    var box = document.getElementById('current');
    if (!s) { box.style.display = 'none'; return; }
    box.style.display = '';
    box.textContent = 'Now: ' + (s.payment_type || 'no plan') + ' · due ' + (s.due_date || '-') + ' · amount due ₹' + (s.amount_due || 0);
    document.getElementById('fee').value = s.amount_due && s.amount_due > 0 ? s.amount_due : '';
    document.getElementById('msg').textContent = '';
  });

  document.getElementById('save-btn').addEventListener('click', function () {
    var id = document.getElementById('student').value;
    var fee = Number(document.getElementById('fee').value);
    var next = document.getElementById('next').value;
    var msg = document.getElementById('msg');
    if (!id) { setMsg(msg, 'Select a student.', false); return; }
    if (!fee || fee <= 0) { setMsg(msg, 'Enter the fixed monthly fee.', false); return; }
    if (!next) { setMsg(msg, 'Enter the next due date.', false); return; }
    var btn = this; btn.disabled = true;
    call({ action: 'crm_update', id: id, student: {
      payment_type: 'Monthly (1st)',
      total_classes_per_cycle: 8,
      amount_due: fee,
      due_date: next,
    } }).then(function (res) {
      if (res.ok) {
        setMsg(msg, 'Saved. Monthly fee ₹' + fee + ' due on ' + next + '.', true);
        loadStudents();
        document.getElementById('student').value = id;
        document.getElementById('current').style.display = 'none';
      } else {
        setMsg(msg, (res.data && res.data.error) || 'Save failed.', false);
      }
    }).catch(function () { setMsg(msg, 'Network problem. Try again.', false); })
      .then(function () { btn.disabled = false; });
  });

  document.getElementById('login-btn').addEventListener('click', function () {
    var pw = document.getElementById('pw').value;
    var lm = document.getElementById('login-msg');
    if (!pw) { lm.textContent = 'Enter the password.'; return; }
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'crm_validate_role', password: pw }) })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        if (d.success && d.role === 'admin' && d.token) {
          TOKEN = d.token; sessionStorage.setItem('crm_token', TOKEN);
          document.getElementById('login-panel').style.display = 'none';
          document.getElementById('form-panel').style.display = '';
          loadStudents();
        } else { lm.textContent = 'Wrong password.'; }
      })
      .catch(function () { lm.textContent = 'Could not log in. Try again.'; });
  });

  if (TOKEN) {
    document.getElementById('form-panel').style.display = '';
    loadStudents();
  } else {
    document.getElementById('login-panel').style.display = '';
  }
})();
</script>
</body>
</html>
