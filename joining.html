<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joining Form | Chords Music Academy</title>
<style>
  :root { --bg:#f7f5f2; --card:#ffffff; --text:#1f1d1a; --muted:#6b6661; --line:#d9d4cd; --accent:#8a4b2a; --accent-text:#ffffff; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#171513; --card:#22201d; --text:#f2eee9; --muted:#a39d96; --line:#3a3632; --accent:#d08a5e; --accent-text:#171513; --err:#f2b8b5; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height:1.4; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .field { margin-bottom:14px; }
  label { display:block; font-size:.9rem; margin-bottom:6px; font-weight:600; }
  input[type=text], input[type=tel], input[type=email], input[type=date], select, textarea {
    width:100%; box-sizing:border-box; padding:10px 12px; font:inherit; color:var(--text);
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
  }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px) { .row { grid-template-columns:1fr; } }
  .days { display:flex; flex-wrap:wrap; gap:8px; }
  .days label { font-weight:500; display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:0; cursor:pointer; }
  .hint { color:var(--muted); font-size:.82rem; margin-top:4px; }
  button { width:100%; padding:12px; font:inherit; font-weight:700; color:var(--accent-text); background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; padding:12px; border-radius:8px; display:none; }
  .msg.ok { display:block; background:var(--card); border:1px solid var(--accent); }
  .msg.err { display:block; color:var(--err); border:1px solid var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Admission Form</h1>
  <p class="sub">Chords Music Academy, Manikonda. Fill this in once you have decided to join. Please use the student's details.</p>

  <form class="card" id="join-form" novalidate>
    <div class="row">
      <div class="field">
        <label for="name">Student's full name *</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label for="phone">Mobile number *</label>
        <input type="tel" id="phone" placeholder="10-digit number" required>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
    </div>

    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" rows="2"></textarea>
    </div>

    <div class="field">
      <label for="guardian">Parent / guardian name (if a minor)</label>
      <input type="text" id="guardian">
    </div>

    <div class="row">
      <div class="field">
        <label for="instrument">Instrument *</label>
        <select id="instrument" required>
          <option value="">Select</option>
          <option>Piano</option>
          <option>Keyboard</option>
          <option>Guitar</option>
          <option>Vocal</option>
          <option>Violin</option>
          <option>Drums</option>
        </select>
      </div>
      <div class="field">
        <label for="level">Current level</label>
        <select id="level">
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="mode">Class mode *</label>
        <select id="mode" required>
          <option value="offline">Offline (Manikonda)</option>
          <option value="online">Online</option>
        </select>
      </div>
      <div class="field">
        <label for="plan">Plan *</label>
        <select id="plan" required>
          <option value="">Select</option>
          <option value="3">3 months</option>
          <option value="6">6 months</option>
          <option value="12">12 months</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Class days *</label>
      <div class="days" id="days">
        <label><input type="checkbox" value="Mon"> Mon</label>
        <label><input type="checkbox" value="Tue"> Tue</label>
        <label><input type="checkbox" value="Wed"> Wed</label>
        <label><input type="checkbox" value="Thu"> Thu</label>
        <label><input type="checkbox" value="Fri"> Fri</label>
        <label><input type="checkbox" value="Sat"> Sat</label>
        <label><input type="checkbox" value="Sun"> Sun</label>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="class_time">Class time</label>
        <input type="text" id="class_time" placeholder="e.g. 6:00 PM">
      </div>
      <div class="field">
        <label for="start_date">Start date</label>
        <input type="date" id="start_date">
        <div class="hint">Leave blank to start today.</div>
      </div>
    </div>

    <button type="submit" id="submit-btn">Submit admission</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
(function () {
  var form = document.getElementById('join-form');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submit-btn');
  var API = '/.netlify/functions/pay-admin-student';

  function show(text, ok) {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var days = Array.prototype.map.call(document.querySelectorAll('#days input:checked'), function (c) { return c.value; });
    var payload = {
      action: 'crm_public_join',
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      dob: document.getElementById('dob').value,
      email: document.getElementById('email').value.trim(),
      address: document.getElementById('address').value.trim(),
      guardian: document.getElementById('guardian').value.trim(),
      instrument: document.getElementById('instrument').value,
      level: document.getElementById('level').value,
      mode: document.getElementById('mode').value,
      plan: document.getElementById('plan').value,
      class_days: days.join(', '),
      class_time: document.getElementById('class_time').value.trim(),
      start_date: document.getElementById('start_date').value
    };

    if (!payload.name || payload.phone.replace(/\D/g, '').length < 10 || !payload.instrument || !payload.plan || !days.length) {
      show('Please fill in name, mobile number, instrument, plan and at least one class day.', false);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';
    try {
      var res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok && data.success) {
        form.reset();
        show('Thank you. Your admission is received. We will contact you to confirm the first class.', true);
      } else {
        show('Something went wrong. Please try again or message us on WhatsApp.', false);
      }
    } catch (err) {
      show('Network problem. Please try again.', false);
    }
    btn.disabled = false;
    btn.textContent = 'Submit admission';
  });
})();
</script>
</body>
</html>
