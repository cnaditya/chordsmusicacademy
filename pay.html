<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-801045653"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-801045653');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay — Chords Music Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center}
.logo{font-size:2.5rem;margin-bottom:8px}
.brand{font-size:1rem;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.sub{font-size:0.75rem;color:#888;margin-bottom:24px}
.order-box{background:#f0f8ff;border:1.5px dashed #1a73e8;border-radius:10px;padding:14px;margin-bottom:20px}
.order-lbl{font-size:0.7rem;color:#666;margin-bottom:3px}
.order-id{font-size:1rem;font-weight:800;color:#1a73e8;letter-spacing:1px}
.pkg-name{font-size:0.82rem;color:#444;margin-top:6px}
.amount{font-size:2.2rem;font-weight:800;color:#e74c3c;margin:16px 0 6px}
.amount-lbl{font-size:0.75rem;color:#888;margin-bottom:20px}
.upi-id-row{background:#f5f5f5;border-radius:10px;padding:12px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.upi-id-val{font-size:1rem;font-weight:700;color:#111;letter-spacing:0.5px}
.copy-btn{background:#1a73e8;color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:0.78rem;font-weight:700;cursor:pointer}
.pay-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.pay-btn{border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff}
.note{font-size:0.75rem;color:#888;line-height:1.5;margin-bottom:16px}
.wa-btn{width:100%;background:#25d366;color:#fff;border:none;border-radius:12px;padding:12px;font-size:0.9rem;font-weight:700;cursor:pointer}
.done-msg{display:none;background:#e8f5e9;color:#2e7d32;padding:14px;border-radius:10px;font-size:0.88rem;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎹</div>
  <div class="brand">Chords Music Academy</div>
  <div class="sub">Manikonda, Hyderabad</div>

  <div class="order-box">
    <div class="order-lbl">Order ID</div>
    <div class="order-id" id="orderId">—</div>
    <div class="pkg-name" id="pkgName"></div>
  </div>

  <div class="amount" id="amtDisplay">₹0</div>
  <div class="amount-lbl">Total Amount</div>

  <div class="upi-id-row">
    <div>
      <div style="font-size:0.65rem;color:#888;margin-bottom:2px">Pay to UPI ID</div>
      <div class="upi-id-val">7702031616@ybl</div>
    </div>
    <button class="copy-btn" onclick="copyUPI(this)">Copy</button>
  </div>

  <div class="pay-btns">
    <button class="pay-btn" style="background:#1a73e8" id="gpayBtn">Pay with Google Pay</button>
    <button class="pay-btn" style="background:#5f259f" id="phonepeBtn">Pay with PhonePe</button>
    <button class="pay-btn" style="background:#00baf2" id="paytmBtn">Pay with Paytm</button>
  </div>

  <div class="note">After payment, tap below to send your payment screenshot on WhatsApp so we can confirm your order.</div>

  <div class="done-msg" id="doneMsg">✅ Payment initiated! Please send the screenshot on WhatsApp to confirm your order.</div>

  <button class="wa-btn" id="waBtn">💬 Send Payment Screenshot on WhatsApp</button>
</div>

<script>
// Read URL params
var params = new URLSearchParams(window.location.search);
var orderId = params.get('id')    || 'N/A';
var amount  = params.get('amount')|| '0';
var pkg     = params.get('pkg')   || '';

document.getElementById('orderId').textContent  = orderId;
document.getElementById('pkgName').textContent  = decodeURIComponent(pkg);
document.getElementById('amtDisplay').textContent = '\u20B9' + Number(amount).toLocaleString('en-IN');

var base = 'pa=7702031616@ybl&pn=Chords+Music+Academy&am=' + amount + '&cu=INR&tn=' + encodeURIComponent(orderId);

function trackPay(app) {
  document.getElementById('doneMsg').style.display = 'block';
  window.location.href = app + '://upi/pay?' + base;
}

document.getElementById('gpayBtn').onclick    = function(){ window.location.href = 'tez://upi/pay?' + base; document.getElementById('doneMsg').style.display='block'; };
document.getElementById('phonepeBtn').onclick = function(){ window.location.href = 'phonepe://pay?' + base; document.getElementById('doneMsg').style.display='block'; };
document.getElementById('paytmBtn').onclick   = function(){ window.location.href = 'paytmmp://pay?' + base; document.getElementById('doneMsg').style.display='block'; };

var waMsg = encodeURIComponent('💳 Payment for Order ' + orderId + ' (' + decodeURIComponent(pkg) + ' — ₹' + amount + ')\n\nPlease find my payment screenshot attached.');
document.getElementById('waBtn').onclick = function(){ window.open('https://api.whatsapp.com/send?phone=917981585309&text=' + waMsg, '_blank'); };

function copyUPI(btn) {
  navigator.clipboard.writeText('7702031616@ybl').then(function(){
    btn.textContent = 'Copied!';
    setTimeout(function(){ btn.textContent = 'Copy'; }, 2000);
  });
}
</script>
</body>
</html>
