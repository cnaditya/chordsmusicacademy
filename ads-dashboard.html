<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ads Dashboard — Chords Music Academy</title>
<style>
  :root{
    color-scheme: light;
    --page-bg:#f9f9f7; --surface:#fcfcfb;
    --ink-primary:#0b0b0b; --ink-secondary:#52514e; --ink-muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --series-piano:#2a78d6; --piano-fill:rgba(42,120,214,0.12);
    --status-good:#0ca30c; --status-warning:#fab219; --status-critical:#d03b3b;
    --brand-navy:#1a1a2e; --brand-navy-2:#2c3e6b;
    --tooltip-bg:#0b0b0b; --tooltip-text:#fcfcfb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --page-bg:#0d0d0d; --surface:#1a1a19;
      --ink-primary:#ffffff; --ink-secondary:#c3c2b7; --ink-muted:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --series-piano:#3987e5; --piano-fill:rgba(57,135,229,0.16);
      --tooltip-bg:#fcfcfb; --tooltip-text:#0b0b0b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--page-bg); color:var(--ink-primary); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:0 16px 32px}
  .wrap{max-width:960px; margin:0 auto}
  header.top{background:var(--brand-navy); color:#fff; margin:0 -16px 24px; padding:20px 16px}
  @media(min-width:640px){ header.top{ padding:24px 32px } }
  .top-inner{max-width:928px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:12px}
  .brand-dot{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand-navy-2),#4a6fd4); display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .brand h1{font-size:1.05rem; font-weight:800; margin:0; line-height:1.25}
  .brand p{font-size:0.75rem; margin:0; opacity:0.65}
  .actions{display:flex; align-items:center; gap:10px}
  .as-of{font-size:0.72rem; opacity:0.7; text-align:right}
  .as-of strong{display:block; font-size:0.82rem; opacity:1; font-weight:700}
  .btn{background:#f0b94d; color:#1a1608; border:none; font-weight:800; font-size:0.75rem; padding:9px 14px; border-radius:20px; cursor:pointer; white-space:nowrap}
  .range-toggle{display:flex; background:rgba(255,255,255,0.12); border-radius:20px; padding:3px; gap:2px}
  .range-toggle button{background:transparent; border:none; color:#fff; opacity:0.7; font-size:0.72rem; font-weight:700; padding:6px 12px; border-radius:16px; cursor:pointer}
  .range-toggle button.on{background:#fff; color:var(--brand-navy); opacity:1}
  .btn:active{transform:scale(0.97)}
  .section-title{font-size:0.72rem; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-muted); margin:0 0 10px}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px}
  .kpi .label{font-size:0.7rem; color:var(--ink-muted); margin-bottom:6px}
  .kpi .value{font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1}
  .kpi .sub{font-size:0.68rem; color:var(--ink-secondary); margin-top:4px}
  .meter-track{height:6px; border-radius:4px; background:var(--grid); margin-top:10px; overflow:hidden}
  .meter-fill{height:100%; border-radius:4px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 14px; margin-bottom:20px}
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px; flex-wrap:wrap}
  .card-head h2{font-size:0.95rem; font-weight:800; margin:0}
  .card-head .note{font-size:0.72rem; color:var(--ink-muted)}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:0.72rem; color:var(--ink-secondary); margin:10px 0 2px}
  .legend .item{display:flex; align-items:center; gap:6px}
  .legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .chart-wrap{position:relative; margin-top:6px}
  svg.chart{width:100%; height:auto; display:block; overflow:visible}
  .tooltip{position:absolute; pointer-events:none; background:var(--tooltip-bg); color:var(--tooltip-text); font-size:0.72rem; padding:6px 9px; border-radius:8px; transform:translate(-50%,-115%); white-space:nowrap; opacity:0; transition:opacity .1s; font-variant-numeric:tabular-nums}
  .tooltip.show{opacity:1}
  .flat-note{font-size:0.78rem; color:var(--ink-secondary); background:var(--page-bg); border:1px dashed var(--border); border-radius:10px; padding:10px 12px; margin-top:12px}
  .flat-note strong{color:var(--ink-primary)}
  table{width:100%; border-collapse:collapse; font-size:0.82rem}
  th{text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-muted); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--grid)}
  td{padding:10px 10px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  td.name{font-variant-numeric:normal; font-weight:700}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:0.68rem; font-weight:700; padding:3px 9px; border-radius:20px}
  .pill.active{background:color-mix(in oklab, var(--status-good) 16%, transparent); color:var(--status-good)}
  .pill.new{background:color-mix(in oklab, var(--ink-muted) 18%, transparent); color:var(--ink-secondary)}
  .table-scroll{overflow-x:auto}
  .flags{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
  .flags li{display:flex; gap:10px; align-items:flex-start; font-size:0.83rem; line-height:1.5}
  .flag-icon{flex-shrink:0; width:20px;height:20px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:0.7rem; margin-top:1px}
  .flag-icon.good{background:color-mix(in oklab, var(--status-good) 18%, transparent); color:var(--status-good)}
  .flag-icon.warn{background:color-mix(in oklab, var(--status-warning) 25%, transparent); color:#8a5a00}
  @media(prefers-color-scheme:dark){ .flag-icon.warn{color:var(--status-warning)} }
  .flag-icon.info{background:color-mix(in oklab, var(--series-piano) 18%, transparent); color:var(--series-piano)}
  footer{font-size:0.72rem; color:var(--ink-muted); text-align:center; padding-top:8px; line-height:1.6}
  .state-msg{text-align:center; padding:60px 20px; color:var(--ink-secondary); font-size:0.9rem}
  .login-gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
  .login-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 28px; max-width:340px; width:100%; text-align:center}
  .login-card h1{font-size:1.1rem; font-weight:800; margin:0 0 6px}
  .login-card p{font-size:0.8rem; color:var(--ink-secondary); margin:0 0 18px}
  .login-card input{width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--page-bg); color:var(--ink-primary); font-size:0.9rem; margin-bottom:10px; box-sizing:border-box}
  .login-error{color:var(--status-critical); font-size:0.78rem; margin-top:10px}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink-primary); color:var(--page-bg); font-size:0.8rem; padding:10px 16px; border-radius:20px; opacity:0; transition:opacity .2s; pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="brand-dot" style="margin:0 auto 14px">🎵</div>
    <h1>Chords Ads Dashboard</h1>
    <p>Enter the password to view live Google Ads performance.</p>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%">Unlock</button>
    <div class="login-error" id="loginError" hidden>Incorrect password</div>
  </div>
</div>

<div class="wrap" id="mainWrap" hidden>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="brand-dot">🎵</div>
        <div>
          <h1>Chords Ads Dashboard</h1>
          <p>Chords Music Academy · Manikonda, Hyderabad</p>
        </div>
      </div>
      <div class="actions">
        <div class="range-toggle" id="rangeToggle">
          <button data-days="7">7d</button>
          <button data-days="30" class="on">30d</button>
          <button data-days="90">90d</button>
        </div>
        <button class="btn" id="copyBtn">Copy Report</button>
        <div class="as-of"><strong id="asOfDate">—</strong><span id="rangeLabel">Last 30 days</span> · live on load</div>
      </div>
    </div>
  </header>

  <div id="content">
    <div class="state-msg">Loading live data from Google Ads…</div>
  </div>
</div>

<div class="toast" id="toast">Report copied — paste it to Claude</div>

<script>
const AD_GROUP_LABEL = {Piano:"Piano", Guitar:"Guitar", vocal:"Vocal", Vocal:"Vocal", Violin:"Violin", Drums:"Drums"};
let CURRENT_DATA = null;

function fmtMoney(n){ return "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:0}); }
function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", {month:"short", day:"numeric"});
}

function render(data){
  CURRENT_DATA = data;
  const c = data.campaign;
  document.getElementById("asOfDate").textContent = fmtDate(data.generated_at);

  const adGroupNames = Object.keys(data.totals).sort();
  const spendCeiling = c.daily_budget * data.days;
  const spendPct = Math.min(100, Math.round((c.cost_30d / spendCeiling) * 100));
  const costPerConv = c.conversions_30d > 0 ? c.cost_30d / c.conversions_30d : null;
  const lost = c.lost_is_budget_pct;
  const lostColor = lost <= 10 ? "var(--status-good)" : lost <= 30 ? "var(--status-warning)" : "var(--status-critical)";

  const kpis = [
    {label:"Daily budget", value: fmtMoney(c.daily_budget), sub:`≈ ${fmtMoney(spendCeiling)} over ${data.days} days`},
    {label:"Spend, 30 days", value: fmtMoney(c.cost_30d), meter: spendPct, meterColor:"var(--series-piano)", sub:`${spendPct}% of ${fmtMoney(spendCeiling)} ceiling`},
    {label:"Conversions, 30 days", value: c.conversions_30d.toFixed(0), sub:`${c.clicks_30d} clicks · ${c.impressions_30d.toLocaleString("en-IN")} impr.`},
    {label:"Cost / conversion", value: costPerConv ? fmtMoney(costPerConv) : "—", sub: costPerConv ? "avg. over 30 days" : "no conversions yet"},
    {label:"Impression share lost to budget", value: lost + "%", meter: lost, meterColor: lostColor, sub:"lower is better"},
  ];

  // Find the ad group with the most impressions to chart (usually the established one)
  let leadName = adGroupNames[0];
  for (const n of adGroupNames) if ((data.totals[n]?.impressions||0) > (data.totals[leadName]?.impressions||0)) leadName = n;
  const leadSeries = data.series[leadName] || [];
  const others = adGroupNames.filter(n => n !== leadName);
  const othersWithZero = others.filter(n => (data.totals[n]?.clicks || 0) === 0);
  const othersWithSome = others.filter(n => (data.totals[n]?.clicks || 0) > 0);

  const W = 720, H = 220, padL = 34, padR = 12, padT = 10, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const values = leadSeries.map(p => p.clicks);
  const rawMax = Math.max(...values, 1);
  const yMax = Math.ceil(rawMax / 5) * 5 || 5;
  const n = leadSeries.length || 1;
  const x = i => padL + (i / (n - 1)) * plotW;
  const y = v => padT + plotH - (v / yMax) * plotH;
  const linePath = leadSeries.map((p,i) => `${i===0?"M":"L"} ${x(i).toFixed(1)} ${y(p.clicks).toFixed(1)}`).join(" ");
  const areaPath = linePath + ` L ${x(n-1).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;
  const gridLines = [0, 0.5, 1].map(f => {
    const v = Math.round(yMax * f);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>
            <text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--ink-muted)">${v}</text>`;
  }).join("");
  const labelEvery = Math.ceil(n / 6);
  const xLabels = leadSeries.map((p,i) => i % labelEvery === 0 || i === n-1 ? `<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-muted)">${fmtDate(p.date)}</text>` : "").join("");
  const hitCircles = leadSeries.map((p,i) => `<circle class="hit" data-date="${p.date}" data-clicks="${p.clicks}" data-cost="${p.cost}" data-conv="${p.conversions}" cx="${x(i)}" cy="${y(p.clicks)}" r="9" fill="transparent"/>`).join("");
  const lastPoint = leadSeries[n-1] || {clicks:0};

  let flatNote = "";
  if (othersWithZero.length) flatNote += `<strong>${othersWithZero.map(x=>AD_GROUP_LABEL[x]||x).join(", ")}</strong> — 0 clicks across all ${data.days} days, not charted. `;
  if (othersWithSome.length) flatNote += othersWithSome.map(x => `<strong>${AD_GROUP_LABEL[x]||x}</strong> — ${data.totals[x].clicks} clicks total`).join("; ") + ". ";
  flatNote += "See the breakdown table below for all ad groups.";

  const rows = adGroupNames.map(name => {
    const t = data.totals[name] || {impressions:0,clicks:0,cost:0,conversions:0};
    const isActive = t.impressions > 50;
    const cpc = t.conversions > 0 ? fmtMoney(t.cost / t.conversions) : "—";
    return `<tr>
      <td class="name">${AD_GROUP_LABEL[name]||name}</td>
      <td>${t.impressions.toLocaleString("en-IN")}</td>
      <td>${t.clicks}</td>
      <td>${fmtMoney(t.cost)}</td>
      <td>${t.conversions.toFixed(0)}</td>
      <td>${cpc}</td>
      <td>${isActive ? '<span class="pill active">● Active</span>' : '<span class="pill new">○ New — no data yet</span>'}</td>
    </tr>`;
  }).join("");

  const flags = [];
  const leadShare = c.conversions_30d > 0 ? Math.round(((data.totals[leadName]?.conversions||0) / c.conversions_30d) * 100) : 100;
  flags.push({type:"info", text:`${AD_GROUP_LABEL[leadName]||leadName} is generating ${leadShare}% of all conversions and most of the spend.`});
  flags.push({type: lost <= 30 ? "good" : "warn", text:`Impression share lost to budget is <strong>${lost}%</strong> (lower is better).`});
  othersWithZero.forEach(name => {
    flags.push({type:"warn", text:`<strong>${AD_GROUP_LABEL[name]||name}</strong> has had zero impressions for its entire lifetime so far. Worth checking if it's stuck behind budget competition.`});
  });

  document.getElementById("content").innerHTML = `
    <div class="section-title">This period</div>
    <div class="kpis">${kpis.map(k => `
      <div class="kpi">
        <div class="label">${k.label}</div>
        <div class="value">${k.value}</div>
        ${k.meter !== undefined ? `<div class="meter-track"><div class="meter-fill" style="width:${k.meter}%;background:${k.meterColor}"></div></div>` : ""}
        <div class="sub">${k.sub}</div>
      </div>`).join("")}
    </div>

    <div class="card">
      <div class="card-head"><h2>${AD_GROUP_LABEL[leadName]||leadName} — daily clicks</h2><div class="note">Last ${data.days} days</div></div>
      <div class="legend"><span class="item"><span class="dot" style="background:var(--series-piano)"></span>${AD_GROUP_LABEL[leadName]||leadName}</span></div>
      <div class="chart-wrap" id="chartWrap">
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${leadName} daily clicks">
          ${gridLines}
          <path d="${areaPath}" fill="var(--piano-fill)" stroke="none"/>
          <path d="${linePath}" fill="none" stroke="var(--series-piano)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${x(n-1)}" cy="${y(lastPoint.clicks)}" r="3.5" fill="var(--series-piano)"/>
          ${xLabels}
          ${hitCircles}
        </svg>
        <div class="tooltip" id="chartTooltip"></div>
      </div>
      <div class="flat-note">${flatNote}</div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Ad group breakdown</h2><div class="note">Last ${data.days} days</div></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Ad group</th><th>Impr.</th><th>Clicks</th><th>Cost</th><th>Conv.</th><th>Cost / conv.</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Flags</h2></div>
      <ul class="flags">${flags.map(f => `<li><span class="flag-icon ${f.type}">${f.type==="good"?"✓":f.type==="warn"?"!":"i"}</span><span>${f.text}</span></li>`).join("")}</ul>
    </div>

    <footer>Google Ads · Customer 341-561-0747 · Campaign "${c.name}" · ₹${c.daily_budget}/day · Live data as of ${data.generated_at}</footer>
  `;

  const tooltip = document.getElementById("chartTooltip");
  const wrap = document.getElementById("chartWrap");
  wrap.querySelectorAll(".hit").forEach(el => {
    el.addEventListener("mouseenter", () => {
      tooltip.innerHTML = `<strong>${fmtDate(el.dataset.date)}</strong><br>${el.dataset.clicks} clicks · ₹${Number(el.dataset.cost).toFixed(0)} · ${el.dataset.conv} conv.`;
      tooltip.classList.add("show");
    });
    el.addEventListener("mousemove", (e) => {
      const rect = wrap.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left) + "px";
      tooltip.style.top = (e.clientY - rect.top) + "px";
    });
    el.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
  });
}

function buildTextReport(data){
  const c = data.campaign;
  const lines = [];
  lines.push(`Chords Ads Report — ${data.generated_at} (last ${data.days} days)`);
  lines.push(`Campaign: ${c.name} · Budget: ₹${c.daily_budget}/day`);
  lines.push(`Impressions: ${c.impressions_30d} · Clicks: ${c.clicks_30d} · Cost: ₹${c.cost_30d} · Conversions: ${c.conversions_30d}`);
  lines.push(`Impression share lost to budget: ${c.lost_is_budget_pct}%`);
  lines.push("");
  lines.push("Ad group breakdown:");
  Object.keys(data.totals).sort().forEach(name => {
    const t = data.totals[name];
    const cpc = t.conversions > 0 ? (t.cost / t.conversions).toFixed(2) : "—";
    lines.push(`- ${AD_GROUP_LABEL[name]||name}: ${t.impressions} impr, ${t.clicks} clicks, ₹${t.cost} cost, ${t.conversions} conv, ₹${cpc}/conv`);
  });
  return lines.join("\n");
}

document.getElementById("copyBtn").addEventListener("click", () => {
  if (!CURRENT_DATA) return;
  const text = buildTextReport(CURRENT_DATA);
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
  });
});

function loadRange(days){
  document.getElementById("content").innerHTML = `<div class="state-msg">Loading live data from Google Ads…</div>`;
  document.getElementById("rangeLabel").textContent = `Last ${days} days`;
  fetch(`/.netlify/functions/ads-report?days=${days}`, {
    headers: { "x-ads-token": sessionStorage.getItem("adsToken") || "" }
  })
    .then(r => {
      if (r.status === 401) { showLogin(true); throw new Error("unauthorized"); }
      return r.json();
    })
    .then(data => {
      if (data.error) throw new Error(data.error);
      render(data);
    })
    .catch(err => {
      if (err.message === "unauthorized") return;
      document.getElementById("content").innerHTML = `<div class="state-msg">Couldn't load live data: ${err.message}<br><br>Try refreshing the page.</div>`;
    });
}

document.getElementById("rangeToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-days]");
  if (!btn) return;
  document.querySelectorAll("#rangeToggle button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  loadRange(btn.dataset.days);
});

function showLogin(wrongPassword){
  sessionStorage.removeItem("adsToken");
  document.getElementById("loginGate").style.display = "flex";
  document.getElementById("mainWrap").hidden = true;
  document.getElementById("loginError").hidden = !wrongPassword;
}

function tryUnlock(){
  const pw = document.getElementById("loginPassword").value;
  if (!pw) return;
  sessionStorage.setItem("adsToken", pw);
  fetch("/.netlify/functions/ads-report?days=30", { headers: { "x-ads-token": pw } })
    .then(r => {
      if (r.status === 401) { showLogin(true); return; }
      document.getElementById("loginGate").style.display = "none";
      document.getElementById("mainWrap").hidden = false;
      return r.json();
    })
    .then(data => { if (data && !data.error) render(data); });
}

document.getElementById("loginBtn").addEventListener("click", tryUnlock);
document.getElementById("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

// If a token from a previous unlock this session already works, skip straight to the dashboard
const savedToken = sessionStorage.getItem("adsToken");
if (savedToken) {
  document.getElementById("loginGate").style.display = "none";
  document.getElementById("mainWrap").hidden = false;
  loadRange(30);
} else {
  document.getElementById("loginGate").style.display = "flex";
}
</script>
</body>
</html>
