<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Request — Chords Music Academy</title>
<style>
  :root {
    --primary: #4f46e5;
    --success: #22c55e;
    --danger: #ef4444;
    --border: #e2e8f0;
    --muted: #64748b;
    --surface: #f8fafc;
    --text: #1e293b;
    --bg: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --border:#2d3748;--muted:#94a3b8;--surface:#1e293b;--text:#f1f5f9;--bg:#0f172a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 28px 24px; width: 100%; max-width: 420px; }
  @media (prefers-color-scheme: dark) { .card { background: var(--surface); } }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo h1 { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
  .logo p { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: var(--surface); color: var(--text); outline: none; transition: border 0.2s; }
  input:focus, textarea:focus { border-color: var(--primary); }
  .field { margin-bottom: 16px; }
  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; margin-top: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { width: auto; padding: 6px 14px; font-size: 0.82rem; font-weight: 600; border-radius: 8px; border: none; background: var(--surface); color: var(--primary); border: 1px solid var(--primary); cursor: pointer; }
  .stu-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .stu-name { font-weight: 700; font-size: 1rem; }
  .stu-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .alert { padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 14px; }
  .alert-error { background: #fee2e2; color: #b91c1c; }
  .alert-success { background: #dcfce7; color: #15803d; text-align: center; }
  .step { display: none; }
  .step.active { display: block; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  /* Calendar */
  .cal-nav { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
  .cal-nav span { font-weight:700;font-size:0.95rem; }
  .cal-nav button { background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--text);font-size:1rem; }
  .cal-nav button:hover { background:var(--surface); }
  .cal-dow { display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:0.72rem;font-weight:600;color:var(--muted);margin-bottom:4px; }
  .cal-days { display:grid;grid-template-columns:repeat(7,1fr);gap:3px; }
  .cal-day { text-align:center;padding:7px 2px;border-radius:6px;font-size:0.85rem;cursor:pointer;user-select:none;transition:background 0.15s; }
  .cal-day:hover { background:var(--surface); }
  .cal-day.selected { background:var(--primary);color:#fff;font-weight:700; }
  .cal-day.empty { cursor:default; }
  .cal-day.today { font-weight:700;box-shadow:inset 0 0 0 1px var(--primary); }
  .chips-wrap { display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:28px; }
  .date-chip { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:0.78rem;display:flex;align-items:center;gap:5px; }
  .date-chip button { background:none;border:none;cursor:pointer;color:var(--muted);font-size:0.85rem;line-height:1;padding:0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🎵 Chords Music Academy</h1>
    <p>Student Leave Request</p>
  </div>

  <!-- STEP 1: Enter Phone -->
  <div class="step active" id="step1">
    <div class="field">
      <label>Your Registered Mobile Number</label>
      <input type="tel" id="s-id-input" placeholder="e.g. 9876543210" autocomplete="tel" maxlength="15">
    </div>
    <div id="lookup-error" class="alert alert-error" style="display:none;"></div>
    <button class="btn" id="lookup-btn" onclick="lookupStudent()">Find My Account →</button>
  </div>

  <!-- STEP 2: Fill leave form -->
  <div class="step" id="step2">
    <div class="stu-box" id="stu-info"></div>
    <div class="field">
      <label>Select Leave Dates <span style="font-weight:400;color:var(--muted);">— tap to pick any dates</span></label>
      <div class="cal-nav">
        <button onclick="calPrev()">◀</button>
        <span id="cal-month-label"></span>
        <button onclick="calNext()">▶</button>
      </div>
      <div class="cal-dow">
        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
      <div id="no-dates-hint" style="font-size:0.78rem;color:var(--muted);margin-top:8px;display:none;">No dates selected yet. Tap dates above.</div>
      <div class="chips-wrap" id="chips-wrap"></div>
    </div>
    <div class="field">
      <label>Reason <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
      <textarea id="l-reason" rows="2" placeholder="e.g. Family function, Out of town, Health reasons…"></textarea>
    </div>
    <div id="submit-error" class="alert alert-error" style="display:none;"></div>
    <button class="btn" id="submit-btn" onclick="submitLeave()">Submit Leave Request</button>
    <button class="btn-sm" style="margin-top:10px;" onclick="reset()">← Not you? Change ID</button>
  </div>

  <!-- STEP 3: Success -->
  <div class="step" id="step3">
    <div class="alert alert-success">
      <div style="font-size:2rem;margin-bottom:8px;">✅</div>
      <div style="font-weight:700;font-size:1rem;margin-bottom:4px;">Leave Request Submitted!</div>
      <div id="success-msg" style="font-size:0.85rem;"></div>
    </div>
    <button class="btn" style="background:var(--surface);color:var(--primary);border:1px solid var(--primary);margin-top:4px;" onclick="submitAnother()">Submit Another Leave</button>
  </div>
</div>

<script>
const API = '/.netlify/functions/pay-admin-student';
let _student = null;
let _selectedDates = new Set(); // ISO date strings "YYYY-MM-DD"
let _calYear, _calMonth;
const TODAY = new Date().toISOString().slice(0,10);

async function post(body) {
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
}

function show(stepId) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
}

/* ── Calendar ── */
function initCal() {
  const now = new Date();
  _calYear = now.getFullYear();
  _calMonth = now.getMonth();
  renderCal();
}

function renderCal() {
  const monthLabel = new Date(_calYear, _calMonth, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  document.getElementById('cal-month-label').textContent = monthLabel;
  const firstDow = new Date(_calYear, _calMonth, 1).getDay();
  const daysInMonth = new Date(_calYear, _calMonth + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < firstDow; i++) html += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sel = _selectedDates.has(iso);
    const isToday = iso === TODAY;
    html += `<div class="cal-day${sel?' selected':''}${isToday?' today':''}" onclick="toggleDate('${iso}')">${d}</div>`;
  }
  document.getElementById('cal-days').innerHTML = html;
  renderChips();
}

function calPrev() {
  _calMonth--;
  if (_calMonth < 0) { _calMonth = 11; _calYear--; }
  renderCal();
}
function calNext() {
  _calMonth++;
  if (_calMonth > 11) { _calMonth = 0; _calYear++; }
  renderCal();
}

function toggleDate(iso) {
  if (_selectedDates.has(iso)) _selectedDates.delete(iso);
  else _selectedDates.add(iso);
  renderCal();
}

function renderChips() {
  const sorted = [..._selectedDates].sort();
  const wrap = document.getElementById('chips-wrap');
  const hint = document.getElementById('no-dates-hint');
  if (sorted.length === 0) {
    wrap.innerHTML = '';
    hint.style.display = '';
    return;
  }
  hint.style.display = 'none';
  wrap.innerHTML = sorted.map(iso => {
    const fmt = new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
    return `<div class="date-chip">${fmt}<button onclick="toggleDate('${iso}')" title="Remove">✕</button></div>`;
  }).join('');
}

/* ── Lookup ── */
async function lookupStudent() {
  const sid = document.getElementById('s-id-input').value.trim();
  const errEl = document.getElementById('lookup-error');
  errEl.style.display = 'none';
  if (!sid) { errEl.textContent = 'Please enter your registered mobile number.'; errEl.style.display = ''; return; }
  const btn = document.getElementById('lookup-btn');
  btn.disabled = true; btn.textContent = 'Looking up…';
  try {
    const d = await post({ action: 'crm_lookup_student', phone: sid });
    _student = d.student;
    document.getElementById('stu-info').innerHTML = `
      <div class="stu-name">${_student.name}</div>
      <div class="stu-meta">${_student.student_id} · ${_student.instrument||''} · ${_student.mode==='online'?'🌐 Online':'🏫 Offline'}</div>`;
    _selectedDates.clear();
    initCal();
    show('step2');
  } catch(e) {
    errEl.textContent = e.message === 'Student not found' ? 'Mobile number not found. Please use the number registered with us.' : e.message;
    errEl.style.display = '';
  }
  btn.disabled = false; btn.textContent = 'Find My Account →';
}

/* ── Submit ── */
async function submitLeave() {
  const reason = document.getElementById('l-reason').value.trim();
  const errEl = document.getElementById('submit-error');
  errEl.style.display = 'none';
  const sorted = [..._selectedDates].sort();
  if (sorted.length === 0) { errEl.textContent = 'Please select at least one leave date.'; errEl.style.display = ''; return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const date_from = sorted[0], date_to = sorted[sorted.length - 1];
    const selected_dates = sorted.join(',');
    await post({ action:'crm_submit_leave', student_db_id:_student.id, student_id:_student.student_id, student_name:_student.name, date_from, date_to, selected_dates, reason });
    const count = sorted.length;
    const fmtList = sorted.slice(0,3).map(iso => new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'})).join(', ');
    const extra = count > 3 ? ` +${count-3} more` : '';
    document.getElementById('success-msg').textContent = `${count} leave day${count!==1?'s':''} submitted (${fmtList}${extra}). Your teacher will be notified.`;
    show('step3');
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = '';
  }
  btn.disabled = false; btn.textContent = 'Submit Leave Request';
}

function reset() { _student = null; document.getElementById('s-id-input').value=''; show('step1'); }
function submitAnother() {
  _selectedDates.clear();
  initCal();
  document.getElementById('l-reason').value='';
  document.getElementById('submit-error').style.display='none';
  show('step2');
}

document.getElementById('s-id-input').addEventListener('keydown', e => { if(e.key==='Enter') lookupStudent(); });
</script>
</body>
</html>
